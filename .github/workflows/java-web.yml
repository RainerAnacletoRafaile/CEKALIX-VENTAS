name: Java Web build (sin Maven)
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Descargar Tomcat 11 y MySQL Connector/J
        run: |
          curl -fsSL https://archive.apache.org/dist/tomcat/tomcat-11/v11.0.29/bin/apache-tomcat-11.0.29.tar.gz -o tomcat.tar.gz
          mkdir tomcat
          tar -xzf tomcat.tar.gz -C tomcat --strip-components=1
          curl -fsSL https://dev.mysql.com/get/Downloads/Connector-J/mysql-connector-j-9.5.0.zip -o mysql.zip
          unzip -q mysql.zip
          MYSQL_JAR="$(find . -name 'mysql-connector-j-9.5.0.jar' -print -quit)"
          echo "MYSQL_JAR=$MYSQL_JAR" >> "$GITHUB_ENV"
      - name: Compilar Java sin Maven
        run: |
          mkdir -p build/classes build/war/WEB-INF/classes
          find src/main/java -name '*.java' > build/sources.txt
          javac --release 17 -encoding UTF-8 -cp "tomcat/lib/servlet-api.jar:$MYSQL_JAR" -d build/classes @build/sources.txt
          cp -R src/main/webapp/. build/war/
          cp -R build/classes/. build/war/WEB-INF/classes/
          jar --create --file build/CEKALIX-VENTAS.war -C build/war .
      - name: Publicar WAR
        uses: actions/upload-artifact@v4
        with:
          name: CEKALIX-VENTAS-war
          path: build/CEKALIX-VENTAS.war
